id: tear-autumn-tree
week: 1
title: 찢어서 만드는 가을 나무
theme: 찢기·붙이기
weekday: 화
age_band: "24-40"
duration_min: 15
art: tear-autumn-tree.svg
front_caption: 찌익~ 찢고, 쏙쏙 붙여서 나뭇잎을 만들어요
materials:
  - 갈색·주황·노란 색종이
  - 나무 기둥이 그려진 도안 (앞면)
  - 딱풀
steps:
  - 색종이를 길게, 작게 마음대로 찢어요.
  - 나무 기둥 위에 풀을 칠해요. 부모님이 같이 잡아줘도 좋아요.
  - 찢은 종이를 나뭇잎처럼 붙여요.
talk_examples:
  - "찌익~ 소리 났다!"
  - "이번엔 노란 잎 붙여볼까?"
hand_experience: 양손을 반대 방향으로 움직여 보고, 손가락 끝으로 작은 조각을 집어봐요.
safety:
  - 찢은 조각을 입에 넣지 않는지 지켜봐 주세요.
  - 놀이는 꼭 보호자와 함께해요.
